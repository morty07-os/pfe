<!DOCTYPE html>
<html>
<head>
    <title>Car Rental Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #chatbox { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: scroll; }
        #user_input { width: 80%; padding: 5px; }
        button { padding: 5px 10px; }
    </style>
</head>
<body>
    <h1>Car Rental Chatbot</h1>
    <div id="chatbox"></div>
    <input type="text" id="user_input" placeholder="Type your question here...">
    <button onclick="sendMessage()">Send</button>
    <script>
        // Simple chatbot responses dictionary
        const responses = {
            "what cars do you have": "We offer sedans, SUVs, and vans. What type are you looking for?",
            "how much is a rental": "Prices start at $30/day for sedans. Would you like a detailed quote?",
            "how do i book a car": "Visit our website, select your car, choose dates, and confirm your booking.",
            "do you offer insurance": "Yes, we provide optional insurance starting at $10/day.",
            "hi": "Hello! How can I help you with your car rental needs today?",
            "hello": "Hi there! How can I assist you with renting a car?",
            "bye": "Goodbye! Feel free to return if you have more questions about car rentals.",
            "thank you": "You're welcome! Let me know if you have any other questions."
        };

        const defaultResponse = "I'm sorry, I didn't understand that. Could you please rephrase or ask something else about car rentals?";

        function sendMessage() {
            let input = document.getElementById('user_input').value;
            if (input.trim() === '') return;
            let chatbox = document.getElementById('chatbox');
            chatbox.innerHTML += '<p><b>You:</b> ' + input + '</p>';
            
            // Look for a matching response in the dictionary
            let response = defaultResponse;
            input = input.toLowerCase().trim();
            for (let key in responses) {
                if (input.includes(key)) {
                    response = responses[key];
                    break;
                }
            }
            
            chatbox.innerHTML += '<p><b>Bot:</b> ' + response + '</p>';
            chatbox.scrollTop = chatbox.scrollHeight;
            document.getElementById('user_input').value = '';
        }

        document.getElementById('user_input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
